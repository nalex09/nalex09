; HaniMandl – firmware pentru Heltec WiFi Kit 32 V3 (ESP32-S3)
;
; Compilare:   pio run
; Încărcare:   pio run -t upload
; Monitor:     pio device monitor
;
; Bazat pe https://github.com/hiveeyes/hanimandl (commit f425e1e, v0.2.13).
; Singura modificare față de upstream: `#define QUETSCHHAHN_LINKS` este activat
; în src/hanimandl.cpp (cerut de mecanica cu roți dințate de pe Printables).

[platformio]
default_envs = heltec_v3

[env:heltec_v3]
; Platforma pioarduino = ESP32 Arduino Core 3.x (necesar pentru ESP32-S3 / Heltec V3)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = heltec_wifi_kit_32_V3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bogde/HX711@^0.7.4
    olikraus/U8g2@^2.28.6
    madhephaestus/ESP32Servo@^3.2.0
